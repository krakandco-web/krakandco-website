<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <rect width="300" height="300" fill="#FAF3E0" rx="12" />
  <!-- Traditional Silver Platter -->
  <ellipse cx="150" cy="190" rx="115" ry="42" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2.5" />
  <!-- Diamond / Rhombus Kaju Katli pieces with silver vark sheen -->
  <g fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1.5">
    <polygon points="120,150 150,135 180,150 150,165" />
    <polygon points="80,165 110,150 140,165 110,180" />
    <polygon points="160,165 190,150 220,165 190,180" />
    <polygon points="120,180 150,165 180,180 150,195" />
    <polygon points="80,195 110,180 140,195 110,210" />
    <polygon points="160,195 190,180 220,195 190,210" />
  </g>
  <!-- Silver foil shine highlights -->
  <polygon points="140,145 155,138 160,148 145,155" fill="#FFFFFF" opacity="0.6" />
  <polygon points="100,160 115,153 120,163 105,170" fill="#FFFFFF" opacity="0.6" />
  <polygon points="180,160 195,153 200,163 185,170" fill="#FFFFFF" opacity="0.6" />
  <text x="150" y="275" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#7A1C1C" text-anchor="middle" letter-spacing="1">KAJU KATLI</text>
</svg>

