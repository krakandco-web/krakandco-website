      <stop offset="0%" stop-color="#9E2A2A" />
      <stop offset="60%" stop-color="#7A1C1C" />
      <stop offset="100%" stop-color="#581111" />
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#burstCenter)" />
  <!-- Radiating sunburst rays -->
  <g fill="#B52C23" opacity="0.25">
