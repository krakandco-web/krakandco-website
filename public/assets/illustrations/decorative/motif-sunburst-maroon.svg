    <path d="M 220 200 L 222 192 L 224 200 L 232 202 L 224 204 L 222 212 L 220 204 L 212 202 Z" />
    <path d="M 1020 220 L 1022 212 L 1024 220 L 1032 222 L 1024 224 L 1022 232 L 1020 224 L 1012 222 Z" />
