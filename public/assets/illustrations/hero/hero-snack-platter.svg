<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" width="500" height="450" style="max-width: 100%; height: auto;">
  <defs>
    <radialGradient id="brassGleam" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#FFE89E" />
      <stop offset="40%" stop-color="#E6AC2A" />
      <stop offset="85%" stop-color="#9C6B0F" />
      <stop offset="100%" stop-color="#5E3F05" />
    </radialGradient>
    <radialGradient id="chipsGold" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF275" />
      <stop offset="50%" stop-color="#E6AC2A" />
      <stop offset="100%" stop-color="#B87309" />
    </radialGradient>
  </defs>

  <!-- Large Brass Urli / Thali Base -->
  <ellipse cx="250" cy="330" rx="210" ry="85" fill="url(#brassGleam)" stroke="#262321" stroke-width="4" />
  <ellipse cx="250" cy="326" rx="195" ry="75" fill="#B87309" stroke="#5E3F05" stroke-width="2" />
  <ellipse cx="250" cy="323" rx="185" ry="68" fill="#804D00" />

  <!-- Piles of Kerala Banana Chips in Center Bowl -->
  <g stroke="#262321" stroke-width="2">
    <!-- Bottom layer of golden chips -->
    <ellipse cx="210" cy="310" rx="32" ry="20" transform="rotate(-15 210 310)" fill="url(#chipsGold)" />
    <ellipse cx="250" cy="315" rx="30" ry="18" transform="rotate(10 250 315)" fill="url(#chipsGold)" />
    <ellipse cx="290" cy="310" rx="32" ry="19" transform="rotate(-5 290 310)" fill="url(#chipsGold)" />
    <ellipse cx="170" cy="315" rx="28" ry="17" transform="rotate(25 170 315)" fill="url(#chipsGold)" />
    <ellipse cx="330" cy="312" rx="29" ry="17" transform="rotate(-20 330 312)" fill="url(#chipsGold)" />

    <!-- Middle layer chips -->
    <ellipse cx="230" cy="285" rx="31" ry="18" transform="rotate(30 230 285)" fill="url(#chipsGold)" />
    <ellipse cx="270" cy="280" rx="33" ry="19" transform="rotate(-25 270 280)" fill="url(#chipsGold)" />
    <ellipse cx="195" cy="285" rx="29" ry="17" transform="rotate(-10 195 285)" fill="url(#chipsGold)" />
    <ellipse cx="305" cy="285" rx="30" ry="18" transform="rotate(15 305 285)" fill="url(#chipsGold)" />

    <!-- Top crispy stack -->
    <ellipse cx="250" cy="255" rx="32" ry="19" transform="rotate(5 250 255)" fill="url(#chipsGold)" />
    <ellipse cx="225" cy="245" rx="28" ry="16" transform="rotate(-18 225 245)" fill="url(#chipsGold)" />
    <ellipse cx="275" cy="248" rx="29" ry="17" transform="rotate(22 275 248)" fill="url(#chipsGold)" />
    <ellipse cx="250" cy="230" rx="26" ry="15" fill="#FFE89E" />
  </g>

  <!-- Traditional Murukku Coils on Left Plate -->
  <g fill="none" stroke="#262321" stroke-width="3.5">
    <ellipse cx="120" cy="270" rx="65" ry="35" fill="url(#brassGleam)" stroke="#262321" stroke-width="3" />
    <!-- Murukku spiral 1 -->
    <path d="M 100 260 C 110 240 140 240 145 260 C 145 275 120 285 105 275 C 95 265 105 250 120 250 C 135 250 135 270 120 270" stroke="#D98A1E" stroke-width="7" stroke-linecap="round" />
    <path d="M 100 260 C 110 240 140 240 145 260 C 145 275 120 285 105 275 C 95 265 105 250 120 250 C 135 250 135 270 120 270" stroke="#FFE89E" stroke-width="2" stroke-linecap="round" />

    <!-- Murukku spiral 2 -->
    <path d="M 125 240 C 135 220 165 220 170 240 C 170 255 145 265 130 255 C 120 245 130 230 145 230" stroke="#D98A1E" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Sev / Mixture Bowl on Right -->
  <g>
    <ellipse cx="370" cy="265" rx="65" ry="35" fill="url(#brassGleam)" stroke="#262321" stroke-width="3" />
    <path d="M 330 265 C 330 235 410 235 410 265 Z" fill="#D98A1E" stroke="#262321" stroke-width="2" />
    <!-- Peanuts & curry leaves in mixture -->
    <ellipse cx="360" cy="245" rx="7" ry="4" transform="rotate(-30 360 245)" fill="#8B2500" stroke="#262321" stroke-width="1.5" />
    <ellipse cx="385" cy="250" rx="8" ry="4" transform="rotate(20 385 250)" fill="#8B2500" stroke="#262321" stroke-width="1.5" />
    <path d="M 345 252 Q 355 245 350 240 Q 340 245 345 252 Z" fill="#1E4D2B" stroke="#262321" stroke-width="1" />
    <path d="M 375 238 Q 385 232 380 228 Q 370 232 375 238 Z" fill="#1E4D2B" stroke="#262321" stroke-width="1" />
  </g>

  <!-- Sparkle Crunch Stars around platter -->
  <g fill="#E6AC2A">
    <path d="M 70 210 L 73 200 L 76 210 L 86 213 L 76 216 L 73 226 L 70 216 L 60 213 Z" />
    <path d="M 430 190 L 433 182 L 436 190 L 444 192 L 436 194 L 433 202 L 430 194 L 422 192 Z" />
    <path d="M 250 170 L 253 160 L 256 170 L 266 173 L 256 176 L 253 186 L 250 176 L 240 173 Z" />
  </g>
</svg>

