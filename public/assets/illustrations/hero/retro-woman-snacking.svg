<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="100%" height="100%">
  <defs>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6AC2A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7A1C1C" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="sariGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6AC2A" />
      <stop offset="50%" stop-color="#D99B26" />
      <stop offset="100%" stop-color="#B84A39" />
    </linearGradient>
  </defs>

  <!-- Golden Radiance Behind Figure -->
  <circle cx="200" cy="220" r="180" fill="url(#haloGlow)" />

  <!-- Retro Sunburst Rays -->
  <g stroke="#E6AC2A" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.4">
    <line x1="200" y1="220" x2="60" y2="80" />
    <line x1="200" y1="220" x2="200" y2="40" />
    <line x1="200" y1="220" x2="340" y2="80" />
    <line x1="200" y1="220" x2="380" y2="220" />
  </g>

  <!-- Torso & Sari -->
  <path d="M 120 450 C 130 380 140 330 200 330 C 260 330 280 380 290 450 Z" fill="#9E2A2B" stroke="#262321" stroke-width="4" />
  <!-- Sari Pallu Draped with Gold Border -->
  <path d="M 110 450 C 130 360 170 320 220 310 C 270 300 290 350 280 450 Z" fill="url(#sariGold)" stroke="#262321" stroke-width="3.5" />
  <path d="M 125 450 C 145 370 180 335 220 325" fill="none" stroke="#FFF" stroke-width="3" stroke-dasharray="6,4" />

  <!-- Neck & Shoulders -->
  <path d="M 175 290 L 175 330 C 185 335 215 335 225 330 L 225 290 Z" fill="#E8B896" stroke="#262321" stroke-width="3" />
  <!-- Traditional Gold Choker / Necklace -->
  <path d="M 176 312 Q 200 325 224 312" fill="none" stroke="#E6AC2A" stroke-width="5" />
  <circle cx="200" cy="322" r="4" fill="#B52C23" />

  <!-- Head & Chin -->
  <path d="M 160 210 C 155 270 175 305 200 305 C 225 305 245 270 240 210 Z" fill="#F0C2A2" stroke="#262321" stroke-width="4" />

  <!-- Lips with bold red lipstick -->
  <path d="M 188 274 Q 200 270 212 274 Q 200 286 188 274 Z" fill="#B52C23" stroke="#262321" stroke-width="2" />
  <line x1="189" y1="274" x2="211" y2="274" stroke="#4D1220" stroke-width="1.5" />

  <!-- Crisp snack chip between fingers towards mouth -->
  <ellipse cx="178" cy="268" rx="14" ry="9" transform="rotate(-25 178 268)" fill="#E6AC2A" stroke="#262321" stroke-width="2.5" />

  <!-- Delicate hand lifting chip -->
  <path d="M 120 340 C 130 300 150 280 170 272 C 174 278 170 288 162 295 C 150 305 140 330 135 350 Z" fill="#E8B896" stroke="#262321" stroke-width="3" />

  <!-- Traditional Red Bindi -->
  <circle cx="200" cy="188" r="4.5" fill="#B52C23" stroke="#E6AC2A" stroke-width="1" />

  <!-- Retro Cat-Eye Sunglasses (Bold Indian commercial art hallmark) -->
  <g stroke="#262321" stroke-width="3.5">
    <!-- Frame Left -->
    <path d="M 162 208 C 160 226 178 230 192 222 C 196 212 188 198 170 198 Z" fill="#262321" />
    <path d="M 165 210 C 164 223 177 226 188 220 C 191 213 185 203 172 203 Z" fill="#E6AC2A" opacity="0.9" />
    <!-- Frame Right -->
    <path d="M 208 222 C 222 230 240 226 238 208 C 230 198 212 212 208 222 Z" fill="#262321" />
    <path d="M 212 220 C 223 226 236 223 235 210 C 228 203 217 213 212 220 Z" fill="#E6AC2A" opacity="0.9" />
    <!-- Bridge -->
    <path d="M 191 210 Q 200 206 209 210" fill="none" stroke="#262321" stroke-width="3.5" />
    <!-- White lens reflection flare -->
    <line x1="168" y1="212" x2="178" y2="222" stroke="#FFF" stroke-width="2" opacity="0.75" />
    <line x1="215" y1="212" x2="225" y2="222" stroke="#FFF" stroke-width="2" opacity="0.75" />
  </g>

  <!-- Big Gold Jhumka Earrings -->
  <g fill="#E6AC2A" stroke="#262321" stroke-width="2">
    <!-- Left Earring -->
    <circle cx="152" cy="245" r="4" />
    <path d="M 144 256 C 144 250 160 250 160 256 Z" />
    <circle cx="147" cy="261" r="1.5" />
    <circle cx="152" cy="261" r="1.5" />
    <circle cx="157" cy="261" r="1.5" />

    <!-- Right Earring -->
    <circle cx="248" cy="245" r="4" />
    <path d="M 240 256 C 240 250 256 250 256 256 Z" />
    <circle cx="243" cy="261" r="1.5" />
    <circle cx="248" cy="261" r="1.5" />
    <circle cx="253" cy="261" r="1.5" />
  </g>

  <!-- Voluminous Retro Hair / Bouffant -->
  <path d="M 155 220 C 130 180 135 120 180 110 C 210 100 260 110 270 160 C 275 190 260 230 245 220 C 235 160 220 150 195 150 C 170 150 160 180 155 220 Z" fill="#262321" />

  <!-- Jasmine / Gajra Flowers in Hair -->
  <g fill="#FFF" stroke="#262321" stroke-width="1.5">
    <circle cx="145" cy="170" r="5" />
    <circle cx="140" cy="180" r="5" />
    <circle cx="142" cy="192" r="5" />
    <circle cx="148" cy="202" r="5" />
    <circle cx="155" cy="210" r="5" />
  </g>
  <!-- Yellow flower centers -->
  <circle cx="145" cy="170" r="1.5" fill="#E6AC2A" />
  <circle cx="140" cy="180" r="1.5" fill="#E6AC2A" />
  <circle cx="142" cy="192" r="1.5" fill="#E6AC2A" />
  <circle cx="148" cy="202" r="1.5" fill="#E6AC2A" />
  <circle cx="155" cy="210" r="1.5" fill="#E6AC2A" />

  <!-- Crunch pop sparkles near mouth -->
  <g fill="#E6AC2A">
    <path d="M 160 250 L 163 242 L 166 250 L 174 253 L 166 256 L 163 264 L 160 256 L 152 253 Z" />
    <path d="M 215 285 L 217 280 L 219 285 L 224 287 L 219 289 L 217 294 L 215 289 L 210 287 Z" />
  </g>
</svg>
