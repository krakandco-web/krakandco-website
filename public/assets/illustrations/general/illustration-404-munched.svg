<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220">
  <!-- Retro matchbox shape with bite taken out -->
  <g transform="rotate(-6 150 110)">
    <!-- Matchbox sleeve -->
    <rect x="50" y="45" width="200" height="130" rx="8" fill="#7A1C1C" stroke="#E6AC2A" stroke-width="3" />
    <rect x="58" y="53" width="184" height="114" rx="4" fill="#FFF8EE" stroke="#262321" stroke-width="1.5" />
    <!-- Big 404 Text -->
    <text x="150" y="125" font-family="'Playfair Display', serif" font-size="64" font-weight="900" fill="#7A1C1C" text-anchor="middle">404</text>
    <text x="150" y="148" font-family="'Poppins', sans-serif" font-size="12" font-weight="700" fill="#262321" letter-spacing="3" text-anchor="middle">SNACK NOT FOUND</text>
    <!-- Big bite mark on top right! -->
    <path d="M 230 40 A 18 18 0 0 0 255 60 A 16 16 0 0 0 240 85 Z" fill="#FFF8EE" stroke="#7A1C1C" stroke-width="2" />
  </g>
  <!-- Crumbs falling -->
  <circle cx="240" cy="95" r="4" fill="#E6AC2A" />
  <circle cx="260" cy="115" r="3" fill="#B52C23" />
  <circle cx="235" cy="135" r="3.5" fill="#7A1C1C" />
</svg>

